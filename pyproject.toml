[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mujoco_warp_lucidrains_fork"
version = "0.0.2"
authors = [
    {name = "Newton Developers", email = "mujoco@deepmind.com"},
    {name = "lucidrains"},
]
description = "MuJoCo Warp fork with an MLX (Metal) rigid-body engine and Nim CPU fast paths"
readme = {file = "mujoco_warp/mps/README.md", content-type = "text/markdown"}
license = "Apache-2.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.10"
dependencies = [
    "absl-py",
    "etils[epath]",
    "mujoco>=3.12.0",
    "numpy",
    "warp-lang>=1.15",
]
keywords = [
    "mujoco",
    "physics",
    "simulation",
    "warp",
    "mlx",
    "metal",
    "apple-silicon",
]

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[[tool.uv.index]]
name = "mujoco"
url = "https://py.mujoco.org/"
explicit = true

[tool.uv.sources]
warp-lang = {index = "nvidia"}
mujoco = {index = "mujoco"}

[project.optional-dependencies]
# MLX (Metal) rigid-body engine, `mujoco_warp.mps` (Apple silicon)
mlx = [
    "mlx",
]
# Nim CPU fast paths for the dense solver and step kernels
nim = [
    "nimporter-plus",
    "setuptools",
]
all = [
    "mlx",
    "nimporter-plus",
    "setuptools",
]
dev = [
    "pre-commit",
    "pytest",
    "pytest-xdist",
    "ruff",
    "pygls>=1.0.0,<2.0.0",
    "lsprotocol>=2023.0.1,<2024.0.0",
    "mujoco>=3.11.0",
    "warp-lang>=1.15",
    "mjviser>=0.0.13",
    "pillow",
]
# TODO(team): cpu and cuda JAX optional dependencies are temporary, remove after we land MJX:Warp
cpu = [
    "jax"
]
cuda = [
    "jax[cuda12]"
]

[project.scripts]
mjwarp-testspeed = "mujoco_warp.testspeed:main"
mjwarp-viewer = "mujoco_warp.viewer:main"
mjwarp-record = "mujoco_warp.record:main"


[project.urls]
Homepage = "https://github.com/lucidrains/mujoco_warp"
Documentation = "https://mujoco.readthedocs.io"
Repository = "https://github.com/lucidrains/mujoco_warp"
Upstream = "https://github.com/google-deepmind/mujoco_warp"
Changelog = "https://mujoco.readthedocs.io/en/stable/changelog.html"

[tool.ruff]
line-length = 128
indent-width = 2
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "D",  # pydocstyle conventions and style
    "I",  # isort
    "W",  # pycodestyle
    "F401",  # unused imports
]

ignore = [
    "D100",  # missing docstring public module
    "D103",  # missing docstring public function
]

[tool.ruff.lint.isort]
force-single-line = true
single-line-exclusions = ["typing"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 100
max-line-length = 128

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D"]
"contrib/*" = ["D"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 100

[tool.pytest.ini_options]
testpaths = ["mujoco_warp"]
norecursedirs = ["benchmarks", "contrib"]

[tool.setuptools]
# runtime data only: the humanoid scene used by `mps.bench` / `mps.validate`
# plus the Nim sources the CPU fast paths compile on import
package-data = { "mujoco_warp" = [
    "test_data/humanoid/*",
    "_src/*.nim",
    "_src/*.nim.cfg",
] }

[tool.setuptools.packages.find]
include = ["mujoco_warp*"]
