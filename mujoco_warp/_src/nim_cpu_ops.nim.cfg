-d:release
--opt:speed
# Match the stock kernels: warp compiles its CPU kernels with `--std=c++17 -O3`,
# i.e. no fast-math reassociation and no FMA contraction.  Keeping the same
# floating-point semantics makes the fast paths bit-exact against the kernels
# they replace.
--passC:"-O3 -march=native -ffp-contract=off -funroll-loops"
